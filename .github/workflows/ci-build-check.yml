name: Next.js CI Build Check

on:
  push:
    branches:
      - main # Triggers on pushes to the main branch
  pull_request:
    branches:
      - main # Also triggers on pull requests to main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your Node.js version, ensure it matches your project's requirement

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile # Corrected from 'pnpm install;'
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            npm install
          fi
          echo 'Dependencies installed successfully.' # Added for logging

      - name: Build Next.js application
        run: npm run build
        env: # Add environment variables if your build needs them
          NEXT_PUBLIC_ENV_VARIABLE_EXAMPLE: 'some_value' # Example, remove or change as needed

      # Optional: Add steps for linting and testing if configured
      # - name: Run ESLint
      #   run: npm run lint

      # - name: Run tests
      #   run: npm run test
